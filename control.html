<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Timer Control</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #111;
    color: #fff;
    min-height: 100vh;
    padding: 1.5rem 1rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    color: #e23636;
    letter-spacing: 0.03em;
  }
  .sub {
    font-size: 0.8rem;
    color: #666;
    margin-bottom: 2rem;
  }

  /* --- Status badge --- */
  #status-badge {
    display: inline-block;
    padding: 0.3rem 0.9rem;
    border-radius: 99px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 1.75rem;
  }
  #status-badge.idle  { background: #2a2a2a; color: #888; }
  #status-badge.running { background: #1a3a1a; color: #4caf50; }
  #status-badge.warn  { background: #3a1a1a; color: #e23636; }
  #status-badge.alarm { background: #e23636; color: #fff; animation: pulse 0.6s steps(1) infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }

  /* --- Live mini clock (shown when running) --- */
  #mini-clock {
    font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    font-weight: 700;
    font-size: 4rem;
    letter-spacing: 0.02em;
    line-height: 1;
    margin-bottom: 2rem;
    display: none;
  }
  #mini-clock.warn  { color: #e23636; }
  #mini-clock.alarm { color: #fff; }

  /* --- Form --- */
  form { width: 100%; max-width: 380px; }

  .field { margin-bottom: 1.25rem; }
  .field label {
    display: block;
    font-size: 0.9rem;
    color: #bbb;
    margin-bottom: 0.5rem;
  }
  .time-inputs {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .time-inputs input {
    flex: 1;
    font-size: 1.4rem;
    padding: 0.75rem 1rem;
    border-radius: 10px;
    border: 1px solid #2e2e2e;
    background: #1c1c1c;
    color: #fff;
    appearance: none;
    -webkit-appearance: none;
    min-width: 0;
    text-align: center;
  }
  .time-inputs input:focus { outline: 2px solid #e23636; border-color: transparent; }
  .time-sep {
    font-size: 1.6rem;
    font-weight: 700;
    color: #555;
    flex-shrink: 0;
  }
  .time-labels {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.3rem;
  }
  .time-labels span {
    flex: 1;
    font-size: 0.72rem;
    color: #666;
    text-align: center;
  }
  .time-labels .sep-spacer { width: 1.2rem; flex-shrink: 0; }

  .btn {
    width: 100%;
    max-width: 380px;
    font-size: 1.2rem;
    font-weight: 700;
    padding: 1rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 0.5rem;
    letter-spacing: 0.03em;
  }
  .btn-start { background: #e23636; color: #fff; }
  .btn-start:hover { background: #c52b2b; }
  .btn-start:active { background: #a02020; }
  .btn-reset { background: #2a2a2a; color: #aaa; }
  .btn-reset:hover { background: #333; color: #fff; }
  .btn-reset:active { background: #1a1a1a; }

  #error {
    color: #ff8181;
    font-size: 0.85rem;
    min-height: 1.2em;
    margin-bottom: 0.75rem;
    text-align: center;
    width: 100%;
    max-width: 380px;
  }

  .conn-err { color: #f88; font-size: 0.8rem; text-align: center; margin-top: 1rem; }
</style>
</head>
<body>
  <h1>Timer Control</h1>
  <p class="sub">open <strong>counter-eight-orcin.vercel.app</strong> on the display</p>

  <div id="status-badge" class="idle">Idle</div>
  <div id="mini-clock">--:--</div>

  <!-- Setup form (idle state) -->
  <div id="setup-view" style="width:100%;display:flex;flex-direction:column;align-items:center;">
    <div id="error"></div>
    <form id="form" style="width:100%;max-width:380px;">
      <div class="field">
        <label>Presentation time</label>
        <div class="time-inputs">
          <input id="pres-min" type="number" min="0" step="1" value="5" inputmode="numeric" placeholder="0" />
          <span class="time-sep">:</span>
          <input id="pres-sec" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" placeholder="00" />
        </div>
        <div class="time-labels">
          <span>min</span><span class="sep-spacer"></span><span>sec</span>
        </div>
      </div>
      <div class="field">
        <label>Reminder at (time remaining)</label>
        <div class="time-inputs">
          <input id="rem-min" type="number" min="0" step="1" value="1" inputmode="numeric" placeholder="0" />
          <span class="time-sep">:</span>
          <input id="rem-sec" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" placeholder="00" />
        </div>
        <div class="time-labels">
          <span>min</span><span class="sep-spacer"></span><span>sec</span>
        </div>
      </div>
      <button type="submit" class="btn btn-start">Start</button>
    </form>
  </div>

  <!-- Running / alarm controls -->
  <div id="running-view" style="display:none;width:100%;display:none;flex-direction:column;align-items:center;">
    <button id="btn-reset" class="btn btn-reset">Reset</button>
  </div>

  <div id="conn-err" class="conn-err" style="display:none;">Connection lost — retrying…</div>

<script>
(function () {
  "use strict";

  var badgeEl    = document.getElementById("status-badge");
  var miniClock  = document.getElementById("mini-clock");
  var setupView  = document.getElementById("setup-view");
  var runningView= document.getElementById("running-view");
  var errorEl    = document.getElementById("error");
  var connErrEl  = document.getElementById("conn-err");
  var formEl     = document.getElementById("form");
  var presMinInput = document.getElementById("pres-min");
  var presSecInput = document.getElementById("pres-sec");
  var remMinInput  = document.getElementById("rem-min");
  var remSecInput  = document.getElementById("rem-sec");
  var btnReset   = document.getElementById("btn-reset");

  var lastStatus = "idle";
  var currentState = { status: "idle", endTime: null, reminderMs: 0 };

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function mmss(sec) {
    if (sec < 0) sec = 0;
    return pad2(Math.floor(sec / 60)) + ":" + pad2(sec % 60);
  }

  function renderState(state) {
    currentState = state;
    var status = state.status;
    var remaining = state.endTime ? Math.ceil((state.endTime - Date.now()) / 1000) : 0;

    // Determine effective display status
    var displayStatus = status;
    if (status === "running") {
      if (remaining <= 0) displayStatus = "alarm";
      else if (state.reminderMs && (remaining * 1000) <= state.reminderMs) displayStatus = "warn";
    }

    // Badge
    badgeEl.className = displayStatus;
    badgeEl.textContent =
      displayStatus === "idle"    ? "Idle" :
      displayStatus === "running" ? "Running" :
      displayStatus === "warn"    ? "Warning" :
                                    "Time’s up!";

    // Mini clock
    if (status === "running") {
      miniClock.style.display = "block";
      miniClock.className = remaining <= 0 ? "alarm" :
                            (state.reminderMs && remaining * 1000 <= state.reminderMs) ? "warn" : "";
      miniClock.textContent = remaining <= 0 ? "00:00" : mmss(remaining);
    } else {
      miniClock.style.display = "none";
    }

    // Views
    if (status === "idle") {
      setupView.style.display = "flex";
      runningView.style.display = "none";
    } else {
      setupView.style.display = "none";
      runningView.style.display = "flex";
    }

    lastStatus = status;
  }

  // Polling
  var failCount = 0;
  function poll() {
    fetch("/api/state")
      .then(function (r) { return r.json(); })
      .then(function (state) {
        failCount = 0;
        connErrEl.style.display = "none";
        renderState(state);
      })
      .catch(function () {
        failCount++;
        if (failCount > 5) connErrEl.style.display = "block";
      });
  }

  poll();
  var pollId = setInterval(poll, 500);

  // Keep the mini-clock ticking between polls
  setInterval(function () {
    if (currentState.status === "running" && currentState.endTime) {
      var remaining = Math.ceil((currentState.endTime - Date.now()) / 1000);
      miniClock.textContent = remaining <= 0 ? "00:00" : mmss(remaining);
    }
  }, 200);

  // Start
  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    errorEl.textContent = "";

    var presMin = parseInt(presMinInput.value, 10) || 0;
    var presSec = parseInt(presSecInput.value, 10) || 0;
    var remMin  = parseInt(remMinInput.value,  10) || 0;
    var remSec  = parseInt(remSecInput.value,  10) || 0;

    var presTotal = presMin * 60 + presSec;
    var remTotal  = remMin  * 60 + remSec;

    if (presTotal < 1) {
      errorEl.textContent = "Presentation time must be at least 1 second."; return;
    }
    if (remTotal < 0) {
      errorEl.textContent = "Reminder must be 0 or more."; return;
    }
    if (remTotal >= presTotal) {
      errorEl.textContent = "Reminder must be less than the presentation time."; return;
    }

    fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "start", presentationSeconds: presTotal, reminderSeconds: remTotal })
    })
      .then(function (r) { return r.json(); })
      .then(renderState)
      .catch(function () { errorEl.textContent = "Failed to start timer. Check connection."; });
  });

  // Reset
  btnReset.addEventListener("click", function () {
    fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "reset" })
    })
      .then(function (r) { return r.json(); })
      .then(renderState)
      .catch(function () {});
  });
})();
</script>
</body>
</html>
